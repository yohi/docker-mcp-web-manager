# Docker Compose V2 Configuration for Docker MCP Web Manager
# Development Environment Configuration

services:
  # データベース移行サービス（初期化とマイグレーション実行）
  db-migrate:
    build:
      context: .
      target: development
    volumes:
      - app-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/app.db
      - NODE_ENV=development
    command: ["/app/scripts/init-db.sh"]
    restart: "no"
    user: "root"
    # セキュリティ設定を一時的に緩和（データベース初期化用）
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    networks:
      - app-network

  # メインWebアプリケーション
  web:
    build:
      context: .
      target: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/app.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-change-in-production-with-strong-key}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - app-data:/app/data
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./next.config.js:/app/next.config.js:ro
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    restart: unless-stopped
    user: "nextjs:nodejs"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Redis (レート制限とセッション管理用)
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - app-network

# 永続化ボリューム
volumes:
  app-data:
    driver: local
    # バインドマウントから通常のボリュームに変更（権限問題回避）
  redis-data:
    driver: local

# ネットワーク設定
networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcp-web-bridge
