# =================================================================
# Docker MCP Web Manager v2 - 本番環境用 Docker Compose
# Production Environment Configuration
# =================================================================

services:
  # メインWebアプリケーション (本番用)
  web:
    build:
      context: .
      target: production
      args:
        - NODE_ENV=production
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/usr/src/app/data/app.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      # パフォーマンス設定
      - SERVER_RATE_USER_RPM=${SERVER_RATE_USER_RPM:-300}
      - SERVER_SSE_HEARTBEAT_INTERVAL=${SERVER_SSE_HEARTBEAT_INTERVAL:-30000}
      - SERVER_SSE_CLIENT_TIMEOUT=${SERVER_SSE_CLIENT_TIMEOUT:-60000}
      - SERVER_SSE_MAX_CONNECTIONS=${SERVER_SSE_MAX_CONNECTIONS:-50}
      - SERVER_SSE_MAX_LINE_LENGTH=${SERVER_SSE_MAX_LINE_LENGTH:-10240}
      - SERVER_SSE_RATE_LIMIT=${SERVER_SSE_RATE_LIMIT:-50}
      - SERVER_SSE_MEMORY_CAP=${SERVER_SSE_MEMORY_CAP:-52428800}
      - SERVER_SSE_PAGE_SIZE=${SERVER_SSE_PAGE_SIZE:-100}
      - SERVER_LOG_RETENTION_DAYS=${SERVER_LOG_RETENTION_DAYS:-7}
      - SERVER_LOG_ROTATION_SIZE=${SERVER_LOG_ROTATION_SIZE:-104857600}
      - SERVER_LOG_ROTATION_INTERVAL=${SERVER_LOG_ROTATION_INTERVAL:-daily}
      # 本番用認証設定
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - SKIP_AUTH=${SKIP_AUTH:-false}
      # Bitwarden設定
      - ENABLE_BITWARDEN_AUTH=${ENABLE_BITWARDEN_AUTH:-true}
      # 暗号化設定
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
    volumes:
      - app-data:/usr/src/app/data
    restart: unless-stopped
    user: "nextjs:nodejs"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

  # Redis (レート制限とセッション管理用)
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # Nginx リバースプロキシ (本番用オプション)
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - nginx  # docker-compose --profile nginx up で有効化

# 永続化ボリューム
volumes:
  app-data:
    driver: local
  redis-data:
    driver: local
  nginx-cache:
    driver: local

# ネットワーク設定
networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcp-web-bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16