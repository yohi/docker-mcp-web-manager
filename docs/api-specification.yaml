openapi: 3.0.3
info:
  title: Docker MCP Web Manager API
  description: |
    REST API for managing Docker MCP (Model Context Protocol) servers.
    
    This API provides comprehensive management capabilities for Docker-based MCP servers including:
    - Server lifecycle management (start, stop, configuration)
    - Catalog browsing and server installation
    - Real-time monitoring and logging
    - Configuration management with encryption
    - Authentication and authorization
    
    ## Authentication
    All API endpoints require JWT-based authentication via NextAuth.js.
    
    ## Rate Limiting
    - Per-IP: 100 requests/minute
    - Per-user: 1000 requests/minute (configurable via SERVER_RATE_USER_RPM)
    
    ## Error Handling
    All errors follow a structured format with error codes and HTTP status mapping.
    
    ## Versioning
    API uses /api/v1/ prefix for version 1.0.0
    
  version: "1.0.0"
  contact:
    name: Docker MCP Web Manager
    url: https://github.com/your-org/docker-mcp-web-manager
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://your-domain.com/api/v1
    description: Production server

paths:
  # Health Check
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the application
      operationId: getHealthStatus
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Application is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Servers Management
  /servers:
    get:
      tags:
        - Servers
      summary: List all MCP servers
      description: Retrieve a paginated list of all MCP servers with filtering and sorting
      operationId: listServers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: status
          in: query
          description: Filter by server status
          schema:
            type: string
            enum: [running, stopped, error, starting, stopping]
        - name: search
          in: query
          description: Search servers by name or description
          schema:
            type: string
      responses:
        '200':
          description: List of servers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - Servers
      summary: Create a new MCP server
      description: Create and configure a new MCP server instance
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Server created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Server with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}:
    get:
      tags:
        - Servers
      summary: Get server details
      description: Retrieve detailed information about a specific MCP server
      operationId: getServer
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
      responses:
        '200':
          description: Server details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - Servers
      summary: Update server configuration
      description: Update the configuration of an existing MCP server
      operationId: updateServer
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags:
        - Servers
      summary: Delete server
      description: Delete an MCP server and clean up associated resources
      operationId: deleteServer
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
      responses:
        '204':
          description: Server deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Cannot delete running server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}/start:
    post:
      tags:
        - Servers
      summary: Start server
      description: Start an MCP server instance
      operationId: startServer
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '202':
          description: Server start initiated (async operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '400':
          description: Server is already running or in invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: Service overloaded, retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}/stop:
    post:
      tags:
        - Servers
      summary: Stop server
      description: Stop an MCP server instance gracefully
      operationId: stopServer
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '202':
          description: Server stop initiated (async operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '400':
          description: Server is already stopped or in invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}/logs:
    get:
      tags:
        - Servers
      summary: Get server logs
      description: Retrieve paginated server logs with optional filtering
      operationId: getServerLogs
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
        - name: level
          in: query
          description: Filter by log level
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: since
          in: query
          description: Get logs since timestamp (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: tail
          in: query
          description: Number of recent log lines to retrieve
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        '200':
          description: Server logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}/logs/stream:
    get:
      tags:
        - Servers
      summary: Stream server logs (SSE)
      description: |
        Stream server logs in real-time using Server-Sent Events.
        
        Security & Resource Limits:
        - Heartbeat interval: 30s (configurable)
        - Client timeout: 60s (configurable)
        - Max connections: 100 (returns 503 when exceeded)
        - Max line length: 10KB per event
        - Rate limit: 100 events/second per connection
        - Memory cap: 50MB per connection
      operationId: streamServerLogs
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
        - name: level
          in: query
          description: Filter by log level
          schema:
            type: string
            enum: [debug, info, warn, error]
      responses:
        '200':
          description: Log stream established
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream of log entries
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: Too many concurrent SSE connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /servers/{id}/logs/download:
    get:
      tags:
        - Servers
      summary: Download server log file
      description: |
        Download server log files with security controls.
        
        Security Features:
        - Path traversal protection (allowlist-based)
        - File extension restrictions (.log, .txt only)
        - Size limits (100MB default)
        - Comprehensive security headers
      operationId: downloadServerLogs
      parameters:
        - $ref: '#/components/parameters/ServerIdParam'
        - name: filename
          in: query
          description: Log file name to download
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+\.(log|txt)$'
      responses:
        '200':
          description: Log file download
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename or path traversal attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Server or log file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Catalog Management
  /catalog:
    get:
      tags:
        - Catalog
      summary: Browse MCP server catalog
      description: Browse available MCP servers in the catalog
      operationId: browseCatalog
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: search
          in: query
          description: Search catalog entries
          schema:
            type: string
      responses:
        '200':
          description: Catalog entries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /catalog/{id}:
    get:
      tags:
        - Catalog
      summary: Get catalog entry details
      description: Get detailed information about a catalog entry
      operationId: getCatalogEntry
      parameters:
        - name: id
          in: path
          required: true
          description: Catalog entry ID
          schema:
            type: string
      responses:
        '200':
          description: Catalog entry details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /catalog/install:
    post:
      tags:
        - Catalog
      summary: Install server from catalog
      description: Install an MCP server from the catalog
      operationId: installFromCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallServerRequest'
      responses:
        '202':
          description: Installation initiated (async operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Server already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Configuration Management
  /config/export:
    get:
      tags:
        - Configuration
      summary: Export configuration
      description: Export system configuration including servers and settings
      operationId: exportConfiguration
      responses:
        '200':
          description: Configuration exported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationExportResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /config/import:
    post:
      tags:
        - Configuration
      summary: Import configuration
      description: Import system configuration from exported data
      operationId: importConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationImportRequest'
      responses:
        '202':
          description: Import initiated (async operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Metrics and Monitoring
  /metrics:
    get:
      tags:
        - Metrics
      summary: Get system metrics
      description: Get system performance and usage metrics
      operationId: getMetrics
      parameters:
        - name: timeRange
          in: query
          description: Time range for metrics
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
            default: 1h
        - name: granularity
          in: query
          description: Data granularity
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
            default: 5m
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ServerIdParam:
      name: id
      in: path
      required: true
      description: Server ID
      schema:
        type: string
        format: uuid
    
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    
    LimitParam:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    
    SortByParam:
      name: sort_by
      in: query
      description: Sort field
      schema:
        type: string
        default: created_at
    
    SortOrderParam:
      name: sort_order
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: Idempotency key for safe retries (24h TTL)
      schema:
        type: string
        format: uuid

  responses:
    BadRequestError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Base Response Types
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid
      required:
        - success
        - timestamp
        - request_id

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [false]
            error:
              type: object
              properties:
                code:
                  type: string
                  description: Error code (e.g., SERVER_001, CONFIG_002)
                message:
                  type: string
                  description: Human-readable error message
                details:
                  type: object
                  description: Additional error context
              required:
                - code
                - message

    # Health Check
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, degraded, unhealthy]
                version:
                  type: string
                uptime:
                  type: integer
                  description: Uptime in seconds
                checks:
                  type: object
                  properties:
                    database:
                      type: string
                      enum: [healthy, unhealthy]
                    docker:
                      type: string
                      enum: [healthy, unhealthy]
                    redis:
                      type: string
                      enum: [healthy, unhealthy]

    # Server Management
    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        image:
          type: string
          description: Docker image name
        status:
          type: string
          enum: [running, stopped, error, starting, stopping]
        port:
          type: integer
          minimum: 1
          maximum: 65535
        environment:
          type: object
          additionalProperties:
            type: string
        resource_limits:
          type: object
          properties:
            memory:
              type: string
              description: Memory limit (e.g., "512M", "1G")
            cpu:
              type: string
              description: CPU limit (e.g., "0.5", "2")
        health_check:
          type: object
          properties:
            endpoint:
              type: string
            interval:
              type: integer
            timeout:
              type: integer
            retries:
              type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_started_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - image
        - status
        - created_at
        - updated_at

    ServerListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: array
              items:
                $ref: '#/components/schemas/Server'
            pagination:
              $ref: '#/components/schemas/PaginationInfo'

    ServerResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              $ref: '#/components/schemas/Server'

    ServerDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              allOf:
                - $ref: '#/components/schemas/Server'
                - type: object
                  properties:
                    logs_preview:
                      type: array
                      items:
                        type: string
                    metrics:
                      type: object
                      properties:
                        cpu_usage:
                          type: number
                        memory_usage:
                          type: number
                        disk_usage:
                          type: number
                        uptime:
                          type: integer

    CreateServerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        image:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        environment:
          type: object
          additionalProperties:
            type: string
        resource_limits:
          type: object
          properties:
            memory:
              type: string
            cpu:
              type: string
        auto_start:
          type: boolean
          default: false
      required:
        - name
        - image

    UpdateServerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        port:
          type: integer
          minimum: 1
          maximum: 65535
        environment:
          type: object
          additionalProperties:
            type: string
        resource_limits:
          type: object
          properties:
            memory:
              type: string
            cpu:
              type: string

    AsyncOperationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              properties:
                job_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [pending, running, completed, failed]
                estimated_duration:
                  type: integer
                  description: Estimated duration in seconds
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100

    LogsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      level:
                        type: string
                        enum: [debug, info, warn, error]
                      message:
                        type: string
                      source:
                        type: string
                total_lines:
                  type: integer
                has_more:
                  type: boolean

    # Catalog Management
    CatalogEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        image:
          type: string
        version:
          type: string
        author:
          type: string
        documentation_url:
          type: string
          format: uri
        source_url:
          type: string
          format: uri
        rating:
          type: number
          minimum: 0
          maximum: 5
        download_count:
          type: integer
        last_updated:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - image
        - version

    CatalogResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: array
              items:
                $ref: '#/components/schemas/CatalogEntry'
            pagination:
              $ref: '#/components/schemas/PaginationInfo'

    CatalogEntryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              allOf:
                - $ref: '#/components/schemas/CatalogEntry'
                - type: object
                  properties:
                    readme:
                      type: string
                    configuration:
                      type: object
                    tools:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          schema:
                            type: object

    InstallServerRequest:
      type: object
      properties:
        catalog_id:
          type: string
        server_name:
          type: string
          minLength: 1
          maxLength: 100
        configuration:
          type: object
          additionalProperties:
            type: string
        auto_start:
          type: boolean
          default: false
      required:
        - catalog_id
        - server_name

    # Configuration Management
    ConfigurationExportResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              properties:
                export_id:
                  type: string
                  format: uuid
                created_at:
                  type: string
                  format: date-time
                servers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Server'
                system_config:
                  type: object
                version:
                  type: string

    ConfigurationImportRequest:
      type: object
      properties:
        configuration:
          type: object
          description: Configuration data from export
        merge_strategy:
          type: string
          enum: [replace, merge, skip_existing]
          default: merge
        dry_run:
          type: boolean
          default: false
      required:
        - configuration

    # Metrics and Monitoring
    MetricsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              properties:
                system:
                  type: object
                  properties:
                    cpu:
                      $ref: '#/components/schemas/MetricData'
                    memory:
                      $ref: '#/components/schemas/MetricData'
                    disk:
                      $ref: '#/components/schemas/MetricData'
                    network:
                      $ref: '#/components/schemas/MetricData'
                servers:
                  type: array
                  items:
                    type: object
                    properties:
                      server_id:
                        type: string
                        format: uuid
                      server_name:
                        type: string
                      cpu:
                        $ref: '#/components/schemas/MetricData'
                      memory:
                        $ref: '#/components/schemas/MetricData'
                      network:
                        $ref: '#/components/schemas/MetricData'

    MetricData:
      type: object
      properties:
        current:
          type: number
        average:
          type: number
        peak:
          type: number
        history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              value:
                type: number

    # Utility Schemas
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
      required:
        - page
        - limit
        - total
        - total_pages
        - has_next
        - has_prev

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Health check and system status
  - name: Servers
    description: MCP server lifecycle management
  - name: Catalog
    description: Server catalog browsing and installation
  - name: Configuration
    description: Configuration import/export
  - name: Metrics
    description: System monitoring and metrics